name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Dioxus CLI
        run: |
          curl -fsSL https://dioxuslabs.com/install.sh | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clean and Build
        run: |
          cargo clean
          source $HOME/.cargo/env
          dx build --release
          
      # --- THIS IS THE DETECTIVE STEP ---
      - name: Find where 'dist' is hiding
        run: |
          echo "Listing all directories to find where build output went:"
          find . -maxdepth 3 -type d

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # If we find it elsewhere, we will update this path in the next step
          folder: dist
          branch: gh-pages
