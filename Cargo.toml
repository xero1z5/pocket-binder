[package]
name = "pocket_binder_ui"
version = "0.1.0"
authors = ["xero <kunalcode05@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
gloo-storage = "0.4.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# =======================================================
# OPTIMIZATION PROFILES
# =======================================================

# This profile is used when you run `dx build --release`
[profile.release]
opt-level = 'z'     # Optimize for size ('z' or 's') rather than execution speed ('3')
lto = true          # Link Time Optimization: Aggressively removes unused code across dependencies
codegen-units = 1   # Compiles using a single thread to maximize optimization (slower build, faster app)
panic = 'abort'     # Removes panic unwinding infrastructure, saving binary size
strip = true        # Strips debug symbols from the final binary
