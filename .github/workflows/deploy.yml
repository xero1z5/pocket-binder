name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (Direct Binary)
        run: |
          # 1. Download the exact v0.7.1 binary archive directly
          wget https://github.com/DioxusLabs/dioxus/releases/download/v0.7.1/dx-x86_64-unknown-linux-gnu.tar.gz
          # 2. Extract it
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          # 3. Move it to the system binaries folder
          sudo mv dx /usr/local/bin/dx
          # 4. Verify it works
          dx --version

      - name: Build App
        run: |
          cargo clean
          dx build --release --platform web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/dx/pocket_binder_ui/release/web/public 
          branch: gh-pages
