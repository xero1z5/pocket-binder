name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Dioxus CLI
        run: |
          curl -fsSL https://dioxuslabs.com/install.sh | sh -s dx-v0.7.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build App
        run: |
          # 1. Force update dependencies to ensure resolution matches the lock file
          cargo update
          # 2. Clean to remove any conflicting cached artifacts
          cargo clean
          # 3. Build
          dx build --release --platform web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Double check this path against your last successful 'Find' log
          folder: target/dx/pocket_binder_ui/release/web/public 
          branch: gh-pages
