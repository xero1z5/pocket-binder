name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Dioxus CLI
        run: |
          # Download the pre-compiled Dioxus CLI binary directly
          curl -L --proto '=https' --tlsv1.2 -sSf https://github.com/dioxuslabs/dioxus/releases/latest/download/dx-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv dx /usr/local/bin/dx
          dx --version

      - name: Clean Build Cache
        run: cargo clean

      - name: Build App
        run: dx build --release

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
